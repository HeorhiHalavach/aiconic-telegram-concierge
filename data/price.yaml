# Прайс салона. ЭТОТ ФАЙЛ ПРАВИТЕ ВЫ РУКАМИ — код его только читает.
# На этапе 2 источником станет Altegio, формат подобран под его данные.
#
# длительность — в минутах, цена — в лари (₾)

салон:
  название: AICONIC
  адрес: "Тбилиси, ул. Абашидзе 12, 2 этаж"
  часы: "10:00-21:00"
  как_найти: "вход со двора, синяя дверь, второй этаж"

услуги:
  - id: back60
    название: "Массаж спины"
    длительность: 60
    цена: 120

  - id: back90
    название: "Массаж спины расширенный"
    длительность: 90
    цена: 170

  - id: classic60
    название: "Классический массаж"
    длительность: 60
    цена: 130

  - id: classic90
    название: "Классический массаж"
    длительность: 90
    цена: 180

  - id: relax60
    название: "Расслабляющий массаж"
    длительность: 60
    цена: 110

  - id: neck30
    название: "Массаж шеи и плеч"
    длительность: 30
    цена: 70

  - id: foot30
    название: "Массаж стоп"
    длительность: 30
    цена: 60

абонементы:
  - название: "Абонемент на 5 сеансов"
    сеансов: 5
    цена: 550
    срок_дней: 90

  - название: "Абонемент на 10 сеансов"
    сеансов: 10
    цена: 1000
    срок_дней: 180

правила:
  - "Записаться можно минимум за 2 часа до визита."
  - "Отменить или перенести можно бесплатно не позднее чем за 3 часа."
  - "Опоздание больше 15 минут сокращает сеанс, стоимость не меняется."
  - "Оплата на месте: наличными или картой."
