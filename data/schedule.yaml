# Мастера и их рабочие часы. ЭТОТ ФАЙЛ ПРАВИТЕ ВЫ РУКАМИ — код его только читает.
#
# Всё время здесь — МЕСТНОЕ ВРЕМЯ САЛОНА (Тбилиси, UTC+4).
# Не путать с датами сообщений Telegram: те приходят в UTC.
#
# пол: ж | м  — нужен, потому что клиенты часто просят мастера определённого пола.
# часы: рабочий интервал в этот день недели; дни задаются в 'график'.

мастера:
  - id: 1
    имя: Нино
    пол: ж
    часы: "10:00-18:00"
    график: [пн, вт, ср, чт, пт]

  - id: 2
    имя: Мариам
    пол: ж
    часы: "13:00-21:00"
    график: [пн, ср, пт, сб]

  - id: 3
    имя: Гиорги
    пол: м
    часы: "11:00-19:00"
    график: [вт, чт, сб, вс]

# Шаг сетки предложений, минуты. 30 — удобно человеку, кратно всем длительностям.
шаг_сетки: 30
